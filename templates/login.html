<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EventAccess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #eef2f7; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { width: 100%; max-width: 380px; border-radius: 12px; border: none; }
    </style>
</head>
<body>
    <div class="card card-login shadow-lg p-4 bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">EventAccess</h3>
            <p class="text-muted small">Sistema de Control de Acceso AFND</p>
        </div>

        {% if error %}
            <div class="alert alert-danger p-2 small text-center mb-3">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" name="usuario" class="form-control" placeholder="Ej. admin o control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Ingresar al Sistema</button>
        </form>

        <div class="mt-4 text-center">
            <span class="text-muted extra-small d-block">Demo de prueba:</span>
            <code class="small">admin / 123</code> | <code class="small">control / 123</code>
        </div>
    </div>
</body>
</html>
